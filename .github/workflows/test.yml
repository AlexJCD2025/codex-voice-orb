name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Doctor command runs
        run: |
          set +e
          python -m orb doctor > /tmp/doctor.txt
          status=$?
          set -e
          cat /tmp/doctor.txt
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "doctor exited $status"
            exit "$status"
          fi
          grep -q microphone /tmp/doctor.txt
          grep -q codex /tmp/doctor.txt
          grep -q stt /tmp/doctor.txt
          grep -q tts /tmp/doctor.txt
