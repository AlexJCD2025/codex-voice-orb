[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-voice-orb"
version = "0.1.0"
description = "Push-to-talk voice bridge from a lavalier mic to Codex CLI on macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
audio = ["sounddevice>=0.5", "numpy>=1.26"]
stt = ["faster-whisper>=1.1"]
hotkey = ["pynput>=1.7"]
dev = ["pytest>=8"]
all = [
  "sounddevice>=0.5",
  "numpy>=1.26",
  "faster-whisper>=1.1",
  "pynput>=1.7",
]

[project.scripts]
orb = "orb.cli:main"

[tool.setuptools.packages.find]
include = ["orb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
